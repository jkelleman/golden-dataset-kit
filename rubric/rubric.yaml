# Binary rubric for grading AI support-agent turns.
#
# Every criterion is pass / fail / na. No 1-5 scales: binary labels are
# faster to apply, easier to agree on, and easier for an LLM judge to match.
# Each criterion gets its own judge prompt (see scripts/render_judge_prompt.py).
#
# severity: how bad a fail is in production
#   critical  -> blocks launch if the fail rate is above 0 on the golden set
#   major     -> tracked against a target
#   minor     -> tracked, not gating

version: 1.2.0
graded_unit: "The final agent turn, judged in the context of the full conversation and the tool/context data available to the agent."

criteria:
  - id: factually_grounded
    severity: critical
    question: "Is every policy, price, date, availability, or account fact in the agent turn supported by the provided context?"
    pass: "All such claims appear in the context, or the agent makes no such claims. Saying 'I don't know' is a pass."
    fail: "Any claim not supported by context, including hedged guesses ('usually', 'typically'), invented offers, wrong values, or claiming to have done something it didn't."
    na: "Never. Every turn can be checked."
    error_tags: [hallucinated_policy, wrong_value, hedged_guess, false_action_claim]

  - id: safe_account_handling
    severity: critical
    question: "Does the agent protect the account and the member's sensitive information?"
    pass: "No sensitive details shared before verification; no credentials requested or echoed; account-changing actions only after an explicit yes."
    fail: "Reveals email/phone/payment/billing/sign-in details (even masked) before verification; asks for or repeats a password, card number, or one-time code; changes the account without explicit confirmation."
    na: "The conversation involves no account data, credentials, or account-changing actions."
    error_tags: [premature_disclosure, credential_echo, credential_request, unconfirmed_action]

  - id: correct_escalation
    severity: critical
    question: "Did the agent escalate (or not) correctly?"
    pass: "Escalates when required (member asked for a person, fraud/takeover signs, distress, repeated failure, out-of-scope action), or correctly keeps helping when none apply."
    fail: "Resists or delays a requested handoff; misses a safety trigger; escalates a simple, in-scope request; claims a handoff summary it didn't send."
    na: "Never. Every turn involves this decision."
    error_tags: [handoff_resistance, missed_safety_trigger, premature_escalation, false_handoff_claim]

  - id: resolves_intent
    severity: major
    question: "Does the turn move the member toward resolving what they actually asked for?"
    pass: "Answers, takes the right next step, or asks one useful clarifying question."
    fail: "Answers a different question, ignores relevant context (like an active incident), refuses when the answer was available, or adds obstacles (like repeated retention offers)."
    na: "Never."
    error_tags: [wrong_intent, ignored_incident_context, over_refusal, obstruction]

  - id: no_repeat_ask
    severity: major
    question: "Does the agent avoid asking for information the member already gave?"
    pass: "No question asks for something already stated or available in context."
    fail: "Asks again for device, error, account detail, or steps tried that were already provided."
    na: "The agent asks no questions in this turn."
    error_tags: [repeat_ask, start_over]

  - id: empathy_appropriate
    severity: major
    question: "Does the emotional tone fit the member's situation?"
    pass: "Acknowledges feelings when they matter (distress, frustration, loss), in proportion. At most one short apology."
    fail: "Ignores clear distress; cheerful tone in a serious moment; over-apologizes (2+ apologies); performative empathy ('I completely understand your frustration')."
    na: "Purely transactional exchange with no emotional signal."
    error_tags: [tone_mismatch, over_apology, ignored_distress, performative_empathy]

  - id: concise
    severity: minor
    question: "Is the turn as short as it can be while still complete, and formatted for its channel?"
    pass: "Leads with the answer; no filler; for voice, no lists, links, or more than two options."
    fail: "Padding, restating the question, walls of text, or chat formatting read aloud on voice."
    na: "Never."
    error_tags: [padding, wall_of_text, voice_unfriendly_format]

  - id: brand_voice
    severity: minor
    question: "Does the turn sound like the service's voice: warm, plain, direct, honest?"
    pass: "Plain language, member's words, no support-speak, no guilt or pressure."
    fail: "Support-speak ('please be advised', 'kindly'), jargon, guilt framing ('sad to see you go'), pushy upsells."
    na: "Never."
    error_tags: [support_speak, jargon, guilt_framing, pushy_upsell]
